<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrintForge M11 Living Battles — r7 concept review</title>
  <style>
    body { margin:0; background:#101317; color:#eee1c5; font-family:Arial,Helvetica,sans-serif; }
    header { position:sticky; top:0; z-index:2; padding:18px; background:#151d24; border-bottom:1px solid #92733a; }
    h1 { margin:0; font-size:20px; letter-spacing:.06em; } p { margin:7px 0 0; color:#cfc3ad; line-height:1.4; }
    main { max-width:1480px; margin:0 auto; padding:18px; } section { margin:0 0 30px; }
    h2 { margin:0 0 10px; font-size:18px; color:#ffdaa0; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
    a { display:block; color:#f6dfaf; text-decoration:none; border:1px solid #866530; background:#1b242c; padding:8px; border-radius:5px; }
    a:focus, a:hover { outline:3px solid #72e7ff; outline-offset:2px; } img { display:block; width:100%; height:auto; margin-top:7px; background:#050708; }
  </style>
</head>
<body>
  <header>
    <h1>CONCEPT COMPOSITE — NOT GAME CAPTURE</h1>
    <p>Portable review links for the r7 offline HTML composition. These PNGs do not depend on any repository assets or a running game.</p>
  </header>
  <main id="review"></main>
  <script>
    const states = ['empty_plan','selected_plan','print_early','print60','rival_print','raw_complete','awaken_in_chamber','launch_from_chamber','step_off_corridor','mat_entry','populated','creature_contact','printer_contact','equipment_fitting','reduced_motion_hc150'];
    const sizes = ['941x1672','576x1024','720x1280'];
    const readable = state => state.replaceAll('_',' ').replace(/\b\w/g, char => char.toUpperCase());
    const root = document.querySelector('#review');
    for (const state of states) {
      const section = document.createElement('section');
      section.innerHTML = `<h2>${readable(state)}</h2><div class="grid"></div>`;
      const grid = section.querySelector('.grid');
      for (const size of sizes) {
        const file = `captures/r7/${state}-${size}.png`;
        grid.insertAdjacentHTML('beforeend', `<a href="${file}">${size}<img src="${file}" alt="${readable(state)} concept composite at ${size}"></a>`);
      }
      root.appendChild(section);
    }
  </script>
</body>
</html>
