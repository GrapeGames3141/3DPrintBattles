plugins {
    id 'com.android.library'
}

android {
    namespace 'com.tak.printforge.legends.admob'
    compileSdk 36

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Copied from the matching Godot 4.7.1 Android template by build_plugin.ps1.
    compileOnly files('../godot-lib.template_debug.aar')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
}
