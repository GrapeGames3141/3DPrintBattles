name: Build game

on:
  # Pushes that only touch the art brief, docs or tools change nothing in the
  # game, so they do not start a build (each full build costs runner minutes).
  push:
    paths-ignore:
      - "art_brief/**"
      - "docs/**"
      - "tools/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "art_brief/**"
      - "docs/**"
      - "tools/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  # One full Windows+Linux+Android build is ~470 MB. GitHub Free includes
  # 500 MB of shared artifact/Packages storage, so keeping more than the
  # latest build immediately hits quota.
  KEEP_BUILDS: "1"

jobs:
  prune:
    name: Free artifact space
    runs-on: ubuntu-latest
    steps:
      - name: Delete old build artifacts before upload
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP_BUILDS = Number(process.env.KEEP_BUILDS);
            const PREFIXES = [
              '3DPrintArena-Windows-',
              '3DPrintArena-Linux-',
              '3DPrintArena-Android-',
              'PrintForgeLegends-Windows-',
              'PrintForgeLegends-Linux-',
              'PrintForgeLegends-Android-',
            ];

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const ours = artifacts.filter((artifact) =>
              !artifact.expired &&
              PREFIXES.some((prefix) => artifact.name.startsWith(prefix))
            );

            const runs = new Map();
            for (const artifact of ours) {
              const runId = artifact.workflow_run?.id;
              if (!runId) {
                continue;
              }
              const created = Date.parse(artifact.created_at);
              const previous = runs.get(runId) || 0;
              if (created > previous) {
                runs.set(runId, created);
              }
            }

            // Leave room for this run: keep N-1 previous builds, delete the rest.
            const keepPrevious = Math.max(KEEP_BUILDS - 1, 0);
            const keepIds = new Set(
              [...runs.entries()]
                .sort((a, b) => b[1] - a[1])
                .slice(0, keepPrevious)
                .map(([runId]) => runId)
            );

            let deleted = 0;
            for (const artifact of ours) {
              const runId = artifact.workflow_run?.id;
              if (keepIds.has(runId)) {
                continue;
              }
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                core.info(`Deleted ${artifact.name} (run ${runId})`);
              } catch (error) {
                core.warning(`Could not delete ${artifact.name}: ${error.message}`);
              }
            }

            core.info(`Pruned ${deleted} artifacts; kept ${keepIds.size} previous builds`);

  desktop:
    name: Build ${{ matrix.target }}
    needs: prune
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows
            preset: Windows Steam
            output: build/windows/3DPrintArena.exe
            artifact_path: build/windows/
            artifact: 3DPrintArena-Windows
          - target: Linux
            preset: Linux
            output: build/linux/3DPrintArena.x86_64
            artifact_path: build/linux/
            artifact: 3DPrintArena-Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import

      - name: Create output directory
        run: mkdir -p "$(dirname '${{ matrix.output }}')"

      - name: Export ${{ matrix.target }}
        run: >-
          godot --headless --path .
          --export-release "${{ matrix.preset }}"
          "${{ matrix.output }}"

      - name: Upload ${{ matrix.target }} build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Build mobile (${{ matrix.target }})
    needs: prune
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Add an iOS entry here in the future. iOS will require a macOS
        # runner, an iOS export preset, Xcode, and Apple signing credentials.
        include:
          - target: Android
            runner: ubuntu-latest
            preset: Android
            output: build/android/3DPrintArena.apk
            artifact: 3DPrintArena-Android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the retired "tools"
          # package, which makes sdkmanager fail. The next step installs
          # exactly what the export needs.
          packages: ""

      - name: Install Android SDK packages
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # Android only installs an update over an existing app when both builds
      # are signed with the same key. Add the optional repository secret
      # ANDROID_DEBUG_KEYSTORE_BASE64 (a base64 PKCS12/JKS keystore with alias
      # "androiddebugkey" and password "android") to get a stable key; without
      # it every run generates a new key and the previous build must be
      # uninstalled first.
      - name: Configure Godot Android tools
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            echo "Using the keystore from the ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::notice::Signed with a freshly generated key. Uninstall the previous build before installing this one, or add the ANDROID_DEBUG_KEYSTORE_BASE64 secret for in-place updates."
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --path . --import

      - name: Create output directory
        run: mkdir -p "$(dirname '${{ matrix.output }}')"

      - name: Export Android debug APK
        run: >-
          godot --headless --path .
          --export-debug "${{ matrix.preset }}"
          "${{ matrix.output }}"

      - name: Verify the APK is signed and installable
        run: |
          APK="${{ matrix.output }}"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "### Android APK"
            echo ""
            echo "- File: \`$(basename "$APK")\` inside the artifact \`${{ matrix.artifact }}-${{ github.sha }}\`"
            echo "- Size: $SIZE bytes"
            echo "- SHA-256: \`$SHA\`"
            echo ""
            echo "Download the artifact from this run's page, unzip it, and open the APK on your phone (allow installs from your file manager or browser when asked)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  cleanup:
    name: Keep last build
    needs: [desktop, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than the last build
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP_BUILDS = Number(process.env.KEEP_BUILDS);
            const PREFIXES = [
              '3DPrintArena-Windows-',
              '3DPrintArena-Linux-',
              '3DPrintArena-Android-',
              'PrintForgeLegends-Windows-',
              'PrintForgeLegends-Linux-',
              'PrintForgeLegends-Android-',
            ];

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const ours = artifacts.filter((artifact) =>
              !artifact.expired &&
              PREFIXES.some((prefix) => artifact.name.startsWith(prefix))
            );

            const runs = new Map();
            for (const artifact of ours) {
              const runId = artifact.workflow_run?.id;
              if (!runId) {
                continue;
              }
              const created = Date.parse(artifact.created_at);
              const previous = runs.get(runId) || 0;
              if (created > previous) {
                runs.set(runId, created);
              }
            }

            const sortedRunIds = [...runs.entries()]
              .sort((a, b) => b[1] - a[1])
              .map(([runId]) => runId);
            if (!sortedRunIds.includes(context.runId)) {
              sortedRunIds.unshift(context.runId);
            }
            const keepIds = new Set(sortedRunIds.slice(0, KEEP_BUILDS));

            let deleted = 0;
            for (const artifact of ours) {
              const runId = artifact.workflow_run?.id;
              if (keepIds.has(runId)) {
                continue;
              }
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                core.info(`Deleted ${artifact.name} (run ${runId})`);
              } catch (error) {
                core.warning(`Could not delete ${artifact.name}: ${error.message}`);
              }
            }

            core.info(`Kept ${keepIds.size} builds, deleted ${deleted} artifacts`);
